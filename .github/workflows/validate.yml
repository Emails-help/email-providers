name: Validate

on:
  push:
    branches: [main]
  pull_request:

# Every change to the data is checked against the schema and the provenance
# rules before a human looks at it, so review is about the settings, not the
# JSON. The rules are in scripts/validate.py; CONTRIBUTING.md explains them.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build_autoconfig.py && git diff --exit-code dist/autoconfig
      - run: python3 scripts/build_autoconfig.py --check
